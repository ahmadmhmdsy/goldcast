id = "CL=F"
lag_bdays = 0
kinds = ["logret"]

[[series]]
name = "dxy"
source = "yahoo"
id = "DX-Y.NYB"
lag_bdays = 0
kinds = ["logret"]

[[series]]
name = "spx"
source = "yahoo"
id = "^GSPC"
lag_bdays = 0
kinds = ["logret"]

[[series]]
name = "vix"
source = "yahoo"
id = "^VIX"
lag_bdays = 0
kinds = ["level", "diff"]

[[series]]
name = "gvz"
source = "fred"
id = "GVZCLS"
lag_bdays = 1
kinds = ["level", "diff"]

[[series]]
name = "real10"
source = "fred"
id = "DFII10"
lag_bdays = 1
kinds = ["level", "diff"]

[[series]]
name = "be10"
source = "fred"
id = "T10YIE"
